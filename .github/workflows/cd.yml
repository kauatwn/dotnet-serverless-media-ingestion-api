name: "LocalStack Deployment (Dev)"

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_PAGER: ""
  LOCALSTACK_ENDPOINT: "http://127.0.0.1:4566"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    name: "Provision Infrastructure & Deploy"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: "Checkout code 🛎️"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Start LocalStack 🐳"
        uses: LocalStack/setup-localstack@7c8a0cb3405bc58be4c8f763f812aa000bc46303 # v0.3.2
        with:
          image-tag: "2026.06.0"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: "Setup Terraform 🛠️"
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: "Terraform Init 🚀"
        working-directory: infra/environments/dev
        run: terraform init -upgrade

      - name: "Terraform Plan (Target ECR) 📋"
        working-directory: infra/environments/dev
        run: |
          terraform plan \
            -target="module.ecr.aws_ecr_repository.this" \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -out=tfplan-ecr

      - name: "Terraform Apply (Target ECR) 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply -input=false tfplan-ecr

      - name: "Export ECR Outputs 📤"
        id: ecr-outputs
        working-directory: infra/environments/dev
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: "Setup Docker Buildx 🐳"
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: network=host

      - name: "Build and Push Docker Image 📦"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: src/MediaIngestionApi.Lambda.UploadImage/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr-outputs.outputs.ecr_url }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-outputs.outputs.ecr_url }}:latest
          platforms: linux/amd64
          cache-from: type=gha,scope=lambda-aot-build
          cache-to: type=gha,mode=max,scope=lambda-aot-build

      - name: "Terraform Plan (Full Infrastructure) 📋"
        working-directory: infra/environments/dev
        run: |
          terraform plan \
            -var="localstack_endpoint=${{ env.LOCALSTACK_ENDPOINT }}" \
            -var="lambda_architecture=x86_64" \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -out=tfplan-full

      - name: "Terraform Apply (Full Infrastructure) 🏗️"
        working-directory: infra/environments/dev
        run: terraform apply -input=false tfplan-full

      - name: "Export Infrastructure Outputs 📤"
        id: infra-outputs
        working-directory: infra/environments/dev
        run: |
          echo "api_id=$(terraform output -raw api_id)" >> "$GITHUB_OUTPUT"
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "function_name=$(terraform output -raw lambda_function_name)" >> "$GITHUB_OUTPUT"

      - name: "Wait for Infrastructure Stabilization ⏳"
        run: |
          echo "Checking Lambda function readiness..."
          aws --endpoint-url="$LOCALSTACK_ENDPOINT" lambda wait function-active-v2 \
            --function-name "${{ steps.infra-outputs.outputs.function_name }}" || sleep 5

      - name: "Run E2E Smoke Test (curl) 🧪"
        working-directory: infra/environments/dev
        run: |
          API_ID="${{ steps.infra-outputs.outputs.api_id }}"
          LOCALSTACK_URL="$LOCALSTACK_ENDPOINT/_aws/execute-api/$API_ID/local/images"
          echo "--- Smoke testing API Gateway at $LOCALSTACK_URL ---"

          RESPONSE=$(curl --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            -sS \
            -w "\n%{http_code}" \
            -X POST "$LOCALSTACK_URL" \
            -H "Content-Type: application/json" \
            -d '{"FileName":"ci_smoke_test.png","ContentType":"image/png","Base64Image":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+ip1sAAAAASUVORK5CYII="}')

          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP $STATUS"
          echo "Body: $BODY"

          if [[ "$STATUS" == "200" && "$BODY" == *"ImageId"* ]]; then
            echo "SUCCESS: Lambda processed the image and saved metadata."
            exit 0
          else
            echo "FAILURE: API did not return the expected result."
            exit 1
          fi
